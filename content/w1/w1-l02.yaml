explanation_md: "`5 == 5.0` est vrai (même valeur). `\"Ana\" == \"ana\"` est faux : `A` et `a` sont des caractères différents. D'où l'intérêt de `.lower()` avant de comparer des mots (Wordle !)."
exam_tip: "Pour comparer des mots sans tenir compte des majuscules : `mot1.lower() == mot2.lower()`."
