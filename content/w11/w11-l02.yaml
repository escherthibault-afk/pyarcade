type: code_fill
title: "Tracer une fonction"
concepts: [matplotlib, plot, listes]
difficulty: 2
estimated_minutes: 4
xp: 35
story: "La trajectoire d'un oiseau : y = x² de 0 à n."
packages: [matplotlib]
statement_md: "Trace `y = x²` pour `x = 0, 1, …, n` (courbe avec `label=\"x²\"`, axes nommés, légende) et **renvoie** la liste des ordonnées."
starter_code: |
  import matplotlib.pyplot as plt


  def plot_squares(n):
      """Plot y = x**2 for x in 0..n and return the list of y values."""
      pass
solution: |
  import matplotlib.pyplot as plt


  def plot_squares(n):
      """Plot y = x**2 for x in 0..n and return the list of y values."""
      xs = list(range(n + 1))
      ys = [x ** 2 for x in xs]
      plt.plot(xs, ys, label="x²")
      plt.xlabel("x")
      plt.ylabel("y")
      plt.legend()
      return ys
tests:
  visible:
    - setup: "plt.close('all')"
      call: plot_squares(3)
      expected: "[0, 1, 4, 9]"
  hidden:
    - setup: "plt.close('all')\nplot_squares(4)"
      call: "[int(v) for v in plt.gca().get_lines()[0].get_ydata()]"
      expected: "[0, 1, 4, 9, 16]"
      label: "la courbe tracée"
    - setup: "plt.close('all')\nplot_squares(2)"
      call: "(plt.gca().get_xlabel() != '', plt.gca().get_legend() is not None)"
      expected: "(True, True)"
      label: "axes et légende"
hints: ["Abscisses : `range(n + 1)`.", "Ordonnées : compréhension.", "Puis `plt.plot`, `xlabel`, `ylabel`, `legend`."]
