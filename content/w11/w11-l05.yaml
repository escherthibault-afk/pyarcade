      pass
solution: |
  import random
  import matplotlib.pyplot as plt


  def dice_histogram(n):
      """Simulate n sums of two dice, plot their histogram and return them."""
      sums = [random.randint(1, 6) + random.randint(1, 6) for _ in range(n)]
      plt.hist(sums, bins=11, range=(1.5, 12.5))
      plt.xlabel("somme")
      plt.ylabel("effectif")
      return sums
tests:
  visible:
    - setup: "plt.close('all')"
      call: len(dice_histogram(100))
      expected: "100"
  hidden:
    - setup: "plt.close('all')\ndice_histogram(500)"
      call: len(plt.gca().patches)
      expected: "11"
      label: "11 barres"
    - setup: "plt.close('all')"
      call: "all(2 <= s <= 12 for s in dice_histogram(1000))"
      expected: "True"
  statistical:
    - expr: "sum(s == 7 for s in dice_histogram(12000)) / 12000"
      approx: 0.1667
      tol: 0.015
hints: ["Une compréhension de `randint(1, 6) + randint(1, 6)`.", "`plt.hist(sums, bins=11, range=(1.5, 12.5))`.", "Renvoie la liste."]
