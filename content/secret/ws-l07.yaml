id: ws-l07
world: secret
type: code_fill
title: "Le trajet le plus rapide (Dijkstra)"
concepts: [graphes, dijkstra, heapq]
difficulty: 5
estimated_minutes: 12
xp: 100
story: "Moins d'arrêts n'est pas toujours plus rapide. Il faut tenir compte des minutes."
statement_md: |
  Renvoie la **durée minimale** (en minutes) de `start` à `goal` en utilisant les connexions dans les deux sens, ou `None`.
  Algorithme de Dijkstra avec `heapq` (file de priorité : on traite toujours la station la plus proche en temps).
files:
  connexions.csv: "@data/metro_connexions.csv"
given_code: |
  import csv
  import heapq


  def read_connexions(file_path):
      with open(file_path, encoding="utf-8") as f:
          return [{"from": int(r["from"]), "to": int(r["to"]), "line": r["line"], "minutes": int(r["minutes"])} for r in csv.DictReader(f)]
starter_code: |
  def fastest_time(connexions, start, goal):
      """Return the minimal travel time from start to goal, or None."""
      pass
solution: |
  def fastest_time(connexions, start, goal):
      """Return the minimal travel time from start to goal, or None."""
      graph = {}
      for c in connexions:
          graph.setdefault(c["from"], []).append((c["to"], c["minutes"]))
          graph.setdefault(c["to"], []).append((c["from"], c["minutes"]))
      best = {start: 0}
      heap = [(0, start)]
      while heap:
          time, node = heapq.heappop(heap)
          if node == goal:
              return time
          if time > best[node]:
              continue
          for nxt, minutes in graph.get(node, []):
              t = time + minutes
              if nxt not in best or t < best[nxt]:
                  best[nxt] = t
                  heapq.heappush(heap, (t, nxt))
      return None
tests:
  visible:
    - call: fastest_time(read_connexions("connexions.csv"), 1, 4)
      expected: "5"
  hidden:
    - call: fastest_time(read_connexions("connexions.csv"), 8, 6)
      expected: "14"
    - call: fastest_time(read_connexions("connexions.csv"), 1, 18)
      expected: "10"
    - call: fastest_time([], 1, 2)
      expected: "None"
hints:
  - "Graphe pondéré : `{station: [(voisine, minutes)]}`."
  - "`heapq.heappush(heap, (temps, station))` et `heapq.heappop(heap)` donne le plus petit temps."
  - "On ignore une entrée de la file si on connaît déjà mieux pour cette station."
