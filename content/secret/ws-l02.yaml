id: ws-l02
world: secret
type: code_fill
title: "Fibonacci avec mémoire"
concepts: [recursion, memoisation, dict]
difficulty: 4
estimated_minutes: 5
xp: 60
story: "La version naïve de Fibonacci recalcule tout des millions de fois. Un dict lui sert de mémoire."
statement_md: |
  `fib(0) = 0`, `fib(1) = 1`, `fib(n) = fib(n-1) + fib(n-2)`. Écris `fib(n, memo=None)` **récursive** avec un dict `memo`
  des valeurs déjà calculées. Le test caché demande `fib(300)` (impossible sans mémoire).
starter_code: |
  def fib(n, memo=None):
      """Return the n-th Fibonacci number (recursive, memoized)."""
      pass
solution: |
  def fib(n, memo=None):
      """Return the n-th Fibonacci number (recursive, memoized)."""
      if memo is None:
          memo = {}
      if n < 2:
          return n
      if n not in memo:
          memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
      return memo[n]
tests:
  visible:
    - call: fib(10)
      expected: "55"
  hidden:
    - call: fib(0)
      expected: "0"
    - call: fib(1)
      expected: "1"
    - call: fib(300)
      expected: "222232244629420445529739893461909967206666939096499764990979600"
      label: "fib(300)"
constraints:
  required: [Recursion]
hints: ["Cas de base n < 2.", "Avant de calculer, regarde si `n` est déjà dans `memo`.", "Passe le même `memo` aux appels récursifs."]
