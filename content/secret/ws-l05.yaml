id: ws-l05
world: secret
type: code_fill
title: "Une classe Vector"
concepts: [classes, methodes_speciales, vecteurs]
difficulty: 4
estimated_minutes: 6
xp: 60
story: "Avec `__add__`, `v1 + v2` additionne enfin des vecteurs !"
statement_md: |
  Complète la classe `Vector` : `__init__(x, y)`, `__add__(other)` (renvoie un nouveau `Vector`), `__mul__(k)` (multiplication par un nombre),
  `length()` (norme), et `__eq__(other)` (même x et même y).
starter_code: |
  import math


  class Vector:
      def __init__(self, x, y):
          pass

      def __add__(self, other):
          pass

      def __mul__(self, k):
          pass

      def length(self):
          pass

      def __eq__(self, other):
          pass
solution: |
  import math


  class Vector:
      def __init__(self, x, y):
          self.x = x
          self.y = y

      def __add__(self, other):
          return Vector(self.x + other.x, self.y + other.y)

      def __mul__(self, k):
          return Vector(self.x * k, self.y * k)

      def length(self):
          return math.sqrt(self.x ** 2 + self.y ** 2)

      def __eq__(self, other):
          return self.x == other.x and self.y == other.y
tests:
  visible:
    - call: (Vector(1, 2) + Vector(3, 4)) == Vector(4, 6)
      expected: "True"
  hidden:
    - call: (Vector(1, -1) * 3) == Vector(3, -3)
      expected: "True"
    - call: Vector(3, 4).length()
      expected: "5.0"
    - call: Vector(1, 2) == Vector(2, 1)
      expected: "False"
    - setup: "a = Vector(1, 1)\nb = a + Vector(1, 1)"
      call: (a.x, b.x)
      expected: "(1, 2)"
      label: "+ crée un nouvel objet"
