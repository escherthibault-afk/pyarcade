story: "Au-delà du TP : regrouper données et fonctions dans un même objet."
statement_md: |
  ```python
  class Boid:
      def __init__(self, x, y):        # le constructeur
          self.pos = (x, y)            # attributs de l'objet
          self.speed = 0

      def move(self, dx, dy):          # une méthode : une fonction qui reçoit l'objet (self)
          self.pos = (self.pos[0] + dx, self.pos[1] + dy)

  b = Boid(1, 2)
  b.move(3, 0)
  print(b.pos)       # (4, 2)
  ```
  Au TP 2048, on fait **sans** classes (style fonctionnel). Ici, tu découvres l'autre manière.
example_code: |
  class Counter:
      def __init__(self):
          self.value = 0

      def increment(self):
          self.value += 1


  c = Counter()
  c.increment()
  print(c.value)
task_md: "Ajoute une méthode `reset(self)` qui remet la valeur à 0. Appelle `increment` trois fois, puis `reset`, puis `increment` deux fois, et affiche `c.value`. Attendu : `2`."
expected_output: "2\n"
solution: |
  class Counter:
      def __init__(self):
          self.value = 0

      def increment(self):
          self.value += 1

      def reset(self):
          self.value = 0


  c = Counter()
  c.increment()
  c.increment()
  c.increment()
  c.reset()
  c.increment()
  c.increment()
  print(c.value)
hints: ["Une méthode prend toujours `self` en premier paramètre.", "`self.value = 0`.", "Appelle les méthodes avec `c.methode()`."]
