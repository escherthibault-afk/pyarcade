id: ws-l03
world: secret
type: code_fill
title: "Remplissage par diffusion"
concepts: [recursion, grilles, voisins]
difficulty: 4
estimated_minutes: 6
xp: 60
story: "L'outil « pot de peinture » : toute la zone connectée change de couleur."
statement_md: |
  Renvoie la **taille** de la zone de cases égales à `grid[y][x]` connectée à `(x, y)` (4 directions).
  Version récursive conseillée, avec un `set` des cases déjà visitées.
starter_code: |
  def region_size(grid, x, y):
      """Return the size of the 4-connected region of equal cells containing (x, y)."""
      pass
solution: |
  def region_size(grid, x, y):
      """Return the size of the 4-connected region of equal cells containing (x, y)."""
      target = grid[y][x]
      seen = set()

      def visit(cx, cy):
          if not (0 <= cy < len(grid) and 0 <= cx < len(grid[0])):
              return 0
          if (cx, cy) in seen or grid[cy][cx] != target:
              return 0
          seen.add((cx, cy))
          return 1 + visit(cx + 1, cy) + visit(cx - 1, cy) + visit(cx, cy + 1) + visit(cx, cy - 1)

      return visit(x, y)
tests:
  visible:
    - call: region_size([[1, 1, 0], [0, 1, 0], [0, 1, 1]], 0, 0)
      expected: "5"
  hidden:
    - call: region_size([[1, 1, 0], [0, 1, 0], [0, 1, 1]], 2, 0)
      expected: "2"
    - call: region_size([[7]], 0, 0)
      expected: "1"
    - call: region_size([[1, 0], [0, 1]], 0, 0)
      expected: "1"
      label: "pas de diagonale"
hints: ["Une fonction intérieure `visit(cx, cy)` qui renvoie le nombre de cases ajoutées.", "Arrêt : hors grille, déjà vue, ou valeur différente.", "1 + les 4 voisins."]
