id: ws-l06
world: secret
type: code_fill
title: "Le plus court chemin (BFS)"
concepts: [graphes, bfs, deque, dict]
difficulty: 5
estimated_minutes: 10
xp: 90
story: "Le métro de Néo-Strasbourg, encore lui. Quel trajet passe par le moins de stations ?"
statement_md: |
  `connexions` est la liste lue dans `connexions.csv` (`{"from", "to", "line", "minutes"}`), utilisable dans les deux sens.
  1. `build_graph(connexions)` → dict `{station: [voisines]}` (voisines dans l'ordre d'apparition).
  2. `shortest_path(graph, start, goal)` → liste des stations du chemin **avec le moins d'arrêts** (parcours en largeur, BFS), ou `None`.
  En cas d'égalité, le BFS qui explore les voisins dans l'ordre de la liste suffit.
files:
  connexions.csv: "@data/metro_connexions.csv"
given_code: |
  import csv
  from collections import deque


  def read_connexions(file_path):
      with open(file_path, encoding="utf-8") as f:
          return [{"from": int(r["from"]), "to": int(r["to"]), "line": r["line"], "minutes": int(r["minutes"])} for r in csv.DictReader(f)]
starter_code: |
  def build_graph(connexions):
      """Return {station: [neighbours]} (both directions)."""
      pass


  def shortest_path(graph, start, goal):
      """Return the path with the fewest stops (BFS), or None."""
      pass
solution: |
  def build_graph(connexions):
      """Return {station: [neighbours]} (both directions)."""
      graph = {}
      for c in connexions:
          graph.setdefault(c["from"], []).append(c["to"])
          graph.setdefault(c["to"], []).append(c["from"])
      return graph


  def shortest_path(graph, start, goal):
      """Return the path with the fewest stops (BFS), or None."""
      previous = {start: None}
      queue = deque([start])
      while queue:
          node = queue.popleft()
          if node == goal:
              path = []
              while node is not None:
                  path.append(node)
                  node = previous[node]
              return path[::-1]
          for nxt in graph.get(node, []):
              if nxt not in previous:
                  previous[nxt] = node
                  queue.append(nxt)
      return None
tests:
  visible:
    - call: 'build_graph([{"from": 1, "to": 2, "line": "A", "minutes": 1}])'
      expected: "{1: [2], 2: [1]}"
    - call: shortest_path(build_graph(read_connexions("connexions.csv")), 1, 4)
      expected: "[1, 2, 3, 4]"
  hidden:
    - call: shortest_path(build_graph(read_connexions("connexions.csv")), 8, 6)
      expected: "[8, 9, 10, 11, 5, 6]"
      label: "avec correspondance"
    - call: shortest_path(build_graph(read_connexions("connexions.csv")), 5, 5)
      expected: "[5]"
    - call: "shortest_path({1: [2], 2: [1], 3: []}, 1, 3)"
      expected: "None"
      label: "inaccessible"
hints:
  - "Graphe : `graph.setdefault(a, []).append(b)` dans les deux sens."
  - "BFS : une file (`deque`), un dict `previous` qui note d'où l'on vient (et sert d'ensemble des visités)."
  - "Arrivé au but, remonte `previous` jusqu'au départ, puis inverse le chemin."
explanation_md: "Le BFS explore les stations par « couches » de distance croissante : la première fois qu'on atteint le but, c'est par un chemin le plus court en nombre d'arrêts. Pour les minutes, il faut Dijkstra (file de priorité)."
