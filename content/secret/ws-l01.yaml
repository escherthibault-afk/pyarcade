id: ws-l01
world: secret
type: lesson
title: "La récursivité"
concepts: [recursion]
difficulty: 3
estimated_minutes: 3
xp: 40
story: "Bienvenue dans le monde secret. Ici, les fonctions s'appellent elles-mêmes."
statement_md: |
  Une fonction **récursive** s'appelle elle-même sur un problème plus petit, jusqu'à un **cas de base** :
  ```python
  def factorial(n):
      if n == 0:              # cas de base : on s'arrête
          return 1
      return n * factorial(n - 1)   # appel récursif sur un problème plus petit
  ```
  Sans cas de base : `RecursionError` (la pile d'appels déborde).
example_code: |
  def factorial(n):
      if n == 0:
          return 1
      return n * factorial(n - 1)


  print(factorial(5))
task_md: "Écris à la place `power(b, e)` récursive (b puissance e, e ≥ 0) et affiche `power(2, 10)`. Attendu : `1024`."
expected_output: "1024\n"
solution: |
  def power(b, e):
      if e == 0:
          return 1
      return b * power(b, e - 1)


  print(power(2, 10))
hints: ["Cas de base : e == 0.", "b^e = b × b^(e-1).", "`return b * power(b, e - 1)`"]
card:
  title: "Récursivité"
  body_md: |
    Un cas de base + un appel sur un problème plus petit. Mémoïsation (dict de résultats) pour éviter de recalculer.
