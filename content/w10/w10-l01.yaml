id: w10-l01
world: 10
type: code_fill
title: "Le premier qui vérifie"
concepts: [recherche, return, listes]
difficulty: 2
estimated_minutes: 3
xp: 30
story: "Trouver le premier joueur au-dessus de 1000 points, et s'arrêter dès qu'on l'a."
statement_md: "Renvoie l'**indice** du premier élément strictement supérieur à `threshold`, ou `-1`."
starter_code: |
  def first_above(items, threshold):
      """Return the index of the first element > threshold, or -1."""
      pass
solution: |
  def first_above(items, threshold):
      """Return the index of the first element > threshold, or -1."""
      for i in range(len(items)):
          if items[i] > threshold:
              return i
      return -1
tests:
  visible:
    - call: first_above([5, 12, 3, 20], 10)
      expected: "1"
  hidden:
    - call: first_above([1, 2], 5)
      expected: "-1"
    - call: first_above([], 0)
      expected: "-1"
    - call: first_above([10, 11], 10)
      expected: "1"
      label: "strictement"
hints: ["Parcours avec les indices.", "Renvoie dès que trouvé.", "`-1` après la boucle."]
