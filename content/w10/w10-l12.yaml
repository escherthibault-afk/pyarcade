id: w10-l12
world: 10
type: write_test
title: "Démasque les faux tris"
concepts: [tri, tests, cas_limites]
difficulty: 3
estimated_minutes: 5
xp: 45
story: "Quatre fonctions de tri, trois bugs subtils."
statement_md: "Écris des `assert` sur `my_sort(items)` (renvoie une nouvelle liste triée, sans modifier `items`)."
signature: |
  def my_sort(items):
      """Return a new list with the elements of items in increasing order."""
implementations:
  - label: A
    correct: false
    code: |
      def my_sort(items):
          items.sort()
          return items
  - label: B
    correct: false
    code: |
      def my_sort(items):
          return sorted(set(items))
  - label: C
    correct: true
    code: |
      def my_sort(items):
          return sorted(items)
  - label: D
    correct: false
    code: |
      def my_sort(items):
          result = list(items)
          for i in range(len(result) - 1):
              if result[i] > result[i + 1]:
                  result[i], result[i + 1] = result[i + 1], result[i]
          return result
starter_code: |
  assert my_sort([2, 1]) == [1, 2]
solution: |
  assert my_sort([3, 2, 1]) == [1, 2, 3]
  assert my_sort([2, 2, 1]) == [1, 2, 2]
  l = [2, 1]
  my_sort(l)
  assert l == [2, 1]
hints: ["A modifie la liste reçue, B perd les doublons, D ne fait qu'un passage.", "Teste [3, 2, 1], une liste avec doublons, et l'intégrité de l'original.", "`l = [2, 1]` ; `my_sort(l)` ; `assert l == [2, 1]`"]
