id: w10-l02
world: 10
type: code_fill
title: "Le dernier qui vérifie"
concepts: [recherche, parcours_inverse]
difficulty: 2
estimated_minutes: 3
xp: 30
story: "Le dernier joueur à avoir battu le record."
statement_md: "Renvoie l'indice du **dernier** élément pair, ou `-1`."
starter_code: |
  def last_even(items):
      """Return the index of the last even element, or -1."""
      pass
solution: |
  def last_even(items):
      """Return the index of the last even element, or -1."""
      for i in range(len(items) - 1, -1, -1):
          if items[i] % 2 == 0:
              return i
      return -1
tests:
  visible:
    - call: last_even([2, 3, 4, 5])
      expected: "2"
  hidden:
    - call: last_even([1, 3])
      expected: "-1"
    - call: last_even([8])
      expected: "0"
hints: ["Parcours de la fin vers le début.", "`range(len(items) - 1, -1, -1)`", "Ou mémorise le dernier trouvé en parcourant normalement."]
