id: w10-l10
world: 10
type: code_fill
title: "Doublons, dans l'ordre"
concepts: [set, doublons, listes]
difficulty: 3
estimated_minutes: 4
xp: 40
story: "Lister les tickets en double, dans l'ordre où le doublon est découvert."
statement_md: "Renvoie la liste des valeurs qui apparaissent **au moins deux fois**, chacune une seule fois, dans l'ordre de leur **deuxième** apparition."
starter_code: |
  def duplicates(items):
      """Return the repeated values, in the order of their second occurrence."""
      pass
solution: |
  def duplicates(items):
      """Return the repeated values, in the order of their second occurrence."""
      seen = set()
      result = []
      for x in items:
          if x in seen and x not in result:
              result.append(x)
          seen.add(x)
      return result
tests:
  visible:
    - call: duplicates([3, 1, 3, 2, 1, 3])
      expected: "[3, 1]"
  hidden:
    - call: duplicates([])
      expected: "[]"
    - call: duplicates([1, 2, 3])
      expected: "[]"
    - call: duplicates([2, 1, 1, 2])
      expected: "[1, 2]"
      label: "ordre de la deuxième apparition"
hints: ["Un set des valeurs déjà vues.", "Une valeur déjà vue et pas encore dans le résultat → ajout.", "Ajoute toujours x au set après le test."]
