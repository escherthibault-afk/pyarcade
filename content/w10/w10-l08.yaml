id: w10-l08
world: 10
type: big_volume
title: "Course : recherche dichotomique"
concepts: [dichotomie, complexite]
difficulty: 4
estimated_minutes: 6
xp: 55
story: "10 000 recherches dans une liste triée de 1 000 000 d'éléments. `in` sur la liste ? Trop lent."
statement_md: |
  Renvoie `True` si `target` est dans la liste **triée** `items`, par **dichotomie** (sans `in`, sans `set`).
  Le test caché fait 10 000 recherches dans un million d'éléments.
starter_code: |
  def contains_sorted(items, target):
      """Return True if target is in the sorted list items (binary search)."""
      for x in items:
          if x == target:
              return True
      return False
solution: |
  def contains_sorted(items, target):
      """Return True if target is in the sorted list items (binary search)."""
      lo = 0
      hi = len(items) - 1
      while lo <= hi:
          mid = (lo + hi) // 2
          if items[mid] == target:
              return True
          if items[mid] < target:
              lo = mid + 1
          else:
              hi = mid - 1
      return False
time_limit_ms: 4000
tests:
  visible:
    - call: contains_sorted([1, 3, 5, 7], 5)
      expected: "True"
    - call: contains_sorted([1, 3, 5, 7], 4)
      expected: "False"
  hidden:
    - call: contains_sorted([], 1)
      expected: "False"
    - setup: "BIG = list(range(0, 2000000, 2))"
      call: "sum(contains_sorted(BIG, k) for k in range(0, 20000, 2))"
      expected: "10000"
      timeout_ms: 4000
      label: "10 000 recherches"
constraints:
  forbidden: [For, "name:set"]
hints: ["Deux bornes lo et hi, un milieu.", "Si le milieu est trop petit, cherche à droite ; sinon à gauche.", "`while lo <= hi:`"]
