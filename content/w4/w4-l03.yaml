id: w4-l03
world: 4
type: code_fill
title: "Compte à rebours"
concepts: [while, listes, compteur]
difficulty: 2
estimated_minutes: 3
xp: 30
story: "3… 2… 1… PARTEZ ! Ta fonction prépare la liste du décompte."
statement_md: "Renvoie la liste `[n, n-1, ..., 1]` en utilisant une boucle **while** (pas de `for`). Pour `n = 0` : liste vide."
starter_code: |
  def countdown(n):
      """Return the list [n, n-1, ..., 1] using a while loop."""
      pass
solution: |
  def countdown(n):
      """Return the list [n, n-1, ..., 1] using a while loop."""
      result = []
      while n > 0:
          result.append(n)
          n = n - 1
      return result
tests:
  visible:
    - call: countdown(3)
      expected: "[3, 2, 1]"
  hidden:
    - call: countdown(0)
      expected: "[]"
      label: "n = 0"
    - call: countdown(1)
      expected: "[1]"
    - call: countdown(-2)
      expected: "[]"
      label: "négatif"
constraints:
  required: [While]
  forbidden: [For, Comprehension]
hints:
  - "Une liste vide au départ, qu'on remplit avec `append`."
  - "Tant que n est positif : ajouter n, puis diminuer n."
  - "`while n > 0: result.append(n); n = n - 1`"
