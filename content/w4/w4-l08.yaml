id: w4-l08
world: 4
type: parsons
title: "Table de multiplication"
concepts: [for, boucles_imbriquees]
difficulty: 3
estimated_minutes: 4
xp: 35
story: "L'écran de l'arcade affiche la table de Pythagore. Reconstitue le générateur."
statement_md: |
  `times_table(n)` renvoie une liste de listes : la ligne `i` (de 1 à n) contient `[i*1, i*2, ..., i*n]`.
  `times_table(2)` → `[[1, 2], [2, 4]]`. Une ligne est un leurre.
lines:
  - "def times_table(n):"
  - "    table = []"
  - "    for i in range(1, n + 1):"
  - "        row = []"
  - "        for j in range(1, n + 1):"
  - "            row.append(i * j)"
  - "        table.append(row)"
  - "    return table"
distractors:
  - "    row = []"
tests:
  visible:
    - call: times_table(2)
      expected: "[[1, 2], [2, 4]]"
  hidden:
    - call: times_table(3)
      expected: "[[1, 2, 3], [2, 4, 6], [3, 6, 9]]"
    - call: times_table(0)
      expected: "[]"
hints:
  - "Une nouvelle ligne vide pour chaque i (dans la première boucle)."
  - "La boucle sur j remplit la ligne ; on ajoute la ligne à la table APRÈS la boucle sur j."
  - "Le leurre crée `row` une seule fois, hors de la boucle : toutes les lignes seraient la même liste."
explanation_md: "Boucles imbriquées : pour chaque i, la boucle intérieure fait n tours. Créer `row = []` à l'intérieur de la boucle externe donne une liste neuve par ligne."
