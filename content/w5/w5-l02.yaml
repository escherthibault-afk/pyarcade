statement_md: "Qu'affiche ce programme ?"
code: |
  l = [5, 8, 2, 9, 4]
  print(l[1:3])
  print(l[-2:])
  print(l[::2])
  l.insert(0, 7)
  print(l)
  x = l.pop()
  print(x, l)
  print(l.index(9))
answer: |
