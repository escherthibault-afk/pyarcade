id: w5-l13
world: 5
type: big_volume
title: "Course contre la montre : doublons"
concepts: [set, complexite, listes]
difficulty: 3
estimated_minutes: 5
xp: 50
story: "100 000 tickets à vérifier. La version naïve met une éternité. Il te faut un `set`."
statement_md: |
  Renvoie `True` si la liste contient au moins un doublon.
  Le test caché utilise **100 000 éléments** : une double boucle (n² ≈ 10¹⁰ comparaisons) dépasse la limite de temps.
  Astuce : `x in un_set` est instantané, alors que `x in une_liste` parcourt toute la liste.
  ```python
  seen = set()      # ensemble vide
  seen.add(x)       # ajouter
  x in seen         # test très rapide
  ```
starter_code: |
  def has_duplicates(items):
      """Return True if some value appears at least twice in items."""
      for i in range(len(items)):
          for j in range(i + 1, len(items)):
              if items[i] == items[j]:
                  return True
      return False
solution: |
  def has_duplicates(items):
      """Return True if some value appears at least twice in items."""
      seen = set()
      for x in items:
          if x in seen:
              return True
          seen.add(x)
      return False
time_limit_ms: 3000
tests:
  visible:
    - call: has_duplicates([3, 1, 3])
      expected: "True"
    - call: has_duplicates([1, 2, 3])
      expected: "False"
  hidden:
    - call: has_duplicates(list(range(100000)))
      expected: "False"
      label: "100 000 éléments distincts"
      timeout_ms: 3000
    - call: has_duplicates(list(range(100000)) + [99999])
      expected: "True"
      timeout_ms: 3000
    - call: has_duplicates([])
      expected: "False"
hints:
  - "Retiens les valeurs déjà vues dans un `set`."
  - "Pour chaque x : si déjà vu → doublon ; sinon, on l'ajoute."
  - "Variante en une ligne : `len(set(items)) < len(items)`."
explanation_md: "La double boucle fait n²/2 comparaisons (5 milliards ici). Le `set` fait n opérations rapides : c'est la différence entre « jamais » et « instantané »."
card:
  title: "set et complexité"
  body_md: |
    `x in liste` parcourt toute la liste (lent). `x in ensemble` est quasi instantané.
    Pour tester l'appartenance souvent : utilise un `set`. `set(l)` élimine les doublons.
