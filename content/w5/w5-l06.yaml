id: w5-l06
world: 5
type: parsons
title: "Où es-tu ?"
concepts: [enumerate, recherche, return]
difficulty: 2
estimated_minutes: 3
xp: 30
story: "Retrouver la position d'un joueur dans le classement."
statement_md: "`position(items, value)` renvoie l'indice de la **première** occurrence de `value`, ou `-1` si absente. Une ligne est un leurre."
lines:
  - "def position(items, value):"
  - "    for i, x in enumerate(items):"
  - "        if x == value:"
  - "            return i"
  - "    return -1"
distractors:
  - "        else:"
tests:
  visible:
    - call: position([4, 7, 7], 7)
      expected: "1"
  hidden:
    - call: position([4, 7], 9)
      expected: "-1"
    - call: position([], 1)
      expected: "-1"
    - call: position([5], 5)
      expected: "0"
hints:
  - "`enumerate` donne à la fois l'indice et la valeur."
  - "Dès qu'on trouve, on renvoie l'indice."
  - "Le `return -1` n'est atteint que si la boucle se termine sans trouver : il est APRÈS la boucle (pas de `else`)."
explanation_md: "Le leurre `else: return -1` renverrait -1 dès le premier élément différent : la recherche s'arrêterait trop tôt."
