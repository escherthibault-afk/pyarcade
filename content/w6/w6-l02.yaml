story: "Additionner deux vecteurs avec + ? Python n'est pas d'accord avec la physique."
statement_md: "Qu'affiche ce programme ?"
code: |
  u = (1, 2)
  v = (3, 4)
  print(u + v)
  print(u * 2)
  a, b = v
  print(a - b)
  print((1, 2) < (1, 3))
  print(len(u + v))
answer: |
  (1, 2, 3, 4)
  (1, 2, 1, 2)
  -1
  True
  4
hints:
  - "`+` entre tuples les met bout à bout (concaténation)."
  - "`* 2` répète le tuple."
  - "Les tuples se comparent élément par élément."
explanation_md: "Pour additionner des vecteurs, il faut une fonction `v_add(u, v)` qui additionne coordonnée par coordonnée. `u + v` concatène !"
exam_tip: "Dans le TP Boids, `pos + vel` avec des tuples ne déplace pas l'oiseau : il crée un tuple de 4 nombres. Utilise `v_add`."
