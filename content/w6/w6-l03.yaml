id: w6-l03
world: 6
type: code_fill
title: "Additionner deux vecteurs"
concepts: [tuple, vecteurs, fonction]
difficulty: 1
estimated_minutes: 2
xp: 25
story: "La position de l'oiseau plus sa vitesse : sa prochaine position."
statement_md: "Renvoie le vecteur somme `(ux + vx, uy + vy)` sous forme de **tuple**."
starter_code: |
  def v_add(u, v):
      """Return the sum of the 2D vectors u and v."""
      pass
solution: |
  def v_add(u, v):
      """Return the sum of the 2D vectors u and v."""
      return (u[0] + v[0], u[1] + v[1])
tests:
  visible:
    - call: v_add((1, 2), (3, 4))
      expected: "(4, 6)"
  hidden:
    - call: v_add((0, 0), (0, 0))
      expected: "(0, 0)"
    - call: v_add((-1.5, 2), (1.5, -2))
      expected: "(0.0, 0)"
    - call: v_add((1, 2), (3, 4))
      pure: true
      expected: "(4, 6)"
hints:
  - "Coordonnée par coordonnée."
  - "`u[0] + v[0]` et `u[1] + v[1]`."
  - "Renvoie un tuple entre parenthèses."
