id: w3-l10
world: 3
type: parsons
title: "Décris le lancer"
concepts: [if, elif, comparaison]
difficulty: 2
estimated_minutes: 3
xp: 30
story: "Le commentateur de l'arcade crie « BRELAN ! » ou « PAIRE ! ». Reconstitue son cerveau."
statement_md: "`describe(a, b, c)` renvoie `\"brelan\"` (3 égaux), `\"paire\"` (exactement 2 égaux) ou `\"rien\"`. Une ligne est un leurre."
lines:
  - "def describe(a, b, c):"
  - "    if a == b == c:"
  - "        return \"brelan\""
  - "    elif a == b or b == c or a == c:"
  - "        return \"paire\""
  - "    return \"rien\""
distractors:
  - "    elif a == b and b == c:"
tests:
  visible:
    - call: describe(4, 4, 4)
      expected: "'brelan'"
  hidden:
    - call: describe(4, 1, 4)
      expected: "'paire'"
    - call: describe(1, 2, 3)
      expected: "'rien'"
    - call: describe(2, 5, 5)
      expected: "'paire'"
hints:
  - "On teste d'abord le cas le plus fort (brelan)."
  - "Une paire : au moins deux égaux parmi les 3 couples possibles."
  - "Le dernier `return` est au niveau de la fonction, pas dans un `else`."
