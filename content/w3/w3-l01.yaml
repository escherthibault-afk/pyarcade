id: w3-l01
world: 3
type: lesson
title: "Le module random"
concepts: [random, randint]
difficulty: 1
estimated_minutes: 2
xp: 15
story: "Les dés de l'arcade sont truqués… par un générateur pseudo-aléatoire. Découvre ses commandes."
statement_md: |
  ```python
  import random
  random.random()        # un float dans [0, 1[  (jamais 1 !)
  random.randint(1, 6)   # un entier entre 1 et 6, BORNES INCLUSES
  random.choice("ABC")   # un élément au hasard
  random.uniform(2, 5)   # un float entre 2 et 5
  ```
example_code: |
  import random

  print(random.randint(1, 6))
  print(random.random())
  print(random.choice(["pile", "face"]))
task_md: "Exécute plusieurs fois : les valeurs changent. Puis ajoute un 4e `print` qui tire un entier entre **10 et 20 inclus**, et exécute."
hints:
  - "Les deux bornes de `randint` sont incluses."
  - "`random.randint(10, 20)`"
  - "`print(random.randint(10, 20))`"
card:
  title: "random"
  body_md: |
    `random()` → [0, 1[ · `randint(a, b)` → a..b **inclus** · `choice(seq)` · `uniform(a, b)` · `seed(n)` pour reproduire.
    Un événement de probabilité p : `random.random() < p`.
exam_tip: "`randint(1, 6)` inclut le 6 (contrairement à `range(1, 6)`). C'est un piège de DS classique."
