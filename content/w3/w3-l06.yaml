story: "Les dés sont jetés (enfin, écrits en dur). Prédis tout."
statement_md: "Qu'affiche ce programme ?"
code: |
  dice = (6, 3, 6)
  print(dice[0] == dice[2])
  print(sorted(dice))
  print(sorted(dice, reverse=True))
  print(max(dice) - min(dice))
  print(dice.count(6))
answer: |
  True
  [3, 6, 6]
  [6, 6, 3]
  3
  2
hints:
  - "`sorted` renvoie toujours une **liste**, même à partir d'un tuple."
  - "`reverse=True` trie dans l'ordre décroissant."
  - "`count(6)` compte les 6."
explanation_md: "`sorted(tuple)` donne une liste. Pour retrouver un tuple : `tuple(sorted(dice))`."
