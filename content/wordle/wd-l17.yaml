id: wd-l17
world: wordle
type: code_fill
title: "Six essais, pas un de plus"
concepts: [while, compteur, break]
difficulty: 3
estimated_minutes: 5
xp: 45
story: "La boucle de jeu doit s'arrêter dès la victoire… et jamais après le 6e essai."
statement_md: |
  `guesses` est la liste des mots que le joueur va proposer, dans l'ordre.
  Renvoie le **numéro de l'essai** (1, 2, …) où il trouve `secret`, ou `0` s'il ne le trouve pas en `max_attempts` essais au plus.
  Utilise une boucle `while` avec un compteur d'essais.
starter_code: |
  def winning_attempt(guesses, secret, max_attempts=6):
      """Return the attempt number (1-based) of the first correct guess, or 0."""
      pass
solution: |
  def winning_attempt(guesses, secret, max_attempts=6):
      """Return the attempt number (1-based) of the first correct guess, or 0."""
      attempt = 0
      while attempt < max_attempts and attempt < len(guesses):
          if guesses[attempt] == secret:
              return attempt + 1
          attempt += 1
      return 0
tests:
  visible:
    - call: winning_attempt(["slate", "crane"], "crane")
      expected: "2"
  hidden:
    - call: winning_attempt(["crane"], "crane")
      expected: "1"
      label: "premier essai (décalage de 1 ?)"
    - call: winning_attempt(["a", "b", "c", "d", "e", "f", "crane"], "crane")
      expected: "0"
      label: "trouvé au 7e essai : trop tard"
    - call: winning_attempt(["a", "b", "c", "d", "e", "crane"], "crane")
      expected: "6"
      label: "pile au 6e essai"
    - call: winning_attempt([], "crane")
      expected: "0"
    - call: winning_attempt(["crane", "crane"], "crane", 1)
      expected: "1"
      label: "s'arrête à la victoire"
constraints:
  required: [While]
hints:
  - "Le compteur `attempt` sert d'indice dans `guesses` (0, 1, 2…) ; le numéro d'essai est `attempt + 1`."
  - "Deux raisons de s'arrêter : plus d'essais autorisés, ou plus de propositions."
  - "`while attempt < max_attempts and attempt < len(guesses):` puis `return attempt + 1` si c'est gagné."
exam_tip: "Décalage de 1 : un compteur qui part de 0 sert d'indice ; le « numéro d'essai » affiché au joueur est `compteur + 1`."
