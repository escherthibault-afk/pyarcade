id: wd-l13
world: wordle
type: lesson
title: "Le hasard : random.choice et la graine"
concepts: [random, choice, seed]
difficulty: 1
estimated_minutes: 2
xp: 15
story: "Le mot secret doit changer à chaque partie… sauf quand on veut tester !"
statement_md: |
  ```python
  import random
  random.choice(["crane", "slate", "plant"])   # un élément au hasard
  random.seed(42)                              # fixe la graine : la suite de tirages devient reproductible
  ```
  Avec la même graine, on obtient toujours les mêmes tirages : c'est ce qui permet de **tester** un programme aléatoire
  (et de proposer le même « mot du jour » à tout le monde).
example_code: |
  import random

  random.seed(2026)
  words = ["crane", "slate", "plant", "ghost", "pixel"]
  print(random.choice(words))
  print(random.choice(words))
task_md: "Exécute plusieurs fois : les mots sont toujours les mêmes. Supprime la ligne `random.seed(2026)` et ré-exécute : ils changent. Valide quand tu as compris (n'importe quelle exécution sans erreur)."
hints:
  - "La graine fixe le point de départ du générateur pseudo-aléatoire."
  - "Sans graine, Python en choisit une différente à chaque lancement."
  - "Rien à écrire : observe !"
card:
  title: "random"
  body_md: |
    `random.choice(l)` un élément, `random.randint(a, b)` entier **entre a et b inclus**, `random.random()` dans [0, 1[.
    `random.seed(n)` rend les tirages reproductibles (tests, mot du jour).
