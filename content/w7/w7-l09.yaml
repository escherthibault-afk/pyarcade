id: w7-l09
world: 7
type: code_fill
title: "Transposer"
concepts: [grilles, transposition, pure]
difficulty: 3
estimated_minutes: 4
xp: 40
story: "Échanger lignes et colonnes : l'astuce du 2048 pour réutiliser une seule fonction dans 4 directions."
statement_md: "Renvoie une **nouvelle** grille où la ligne `i` est la colonne `i` de `grid` (la grille peut être rectangulaire). Ne modifie pas `grid`."
starter_code: |
  def transpose_grid(grid):
      """Return the transposed grid (rows become columns)."""
      pass
solution: |
  def transpose_grid(grid):
      """Return the transposed grid (rows become columns)."""
      if len(grid) == 0:
          return []
      result = []
      for x in range(len(grid[0])):
          column = []
          for y in range(len(grid)):
              column.append(grid[y][x])
          result.append(column)
      return result
tests:
  visible:
    - call: transpose_grid([[1, 2], [3, 4]])
      expected: "[[1, 3], [2, 4]]"
  hidden:
    - call: transpose_grid([[1, 2, 3], [4, 5, 6]])
      expected: "[[1, 4], [2, 5], [3, 6]]"
      label: "rectangulaire"
    - call: transpose_grid([])
      expected: "[]"
    - call: transpose_grid([[1, 2], [3, 4]])
      pure: true
      expected: "[[1, 3], [2, 4]]"
hints:
  - "La nouvelle ligne x contient `grid[y][x]` pour chaque y."
  - "Double boucle : x à l'extérieur, y à l'intérieur."
  - "Champion : `[list(col) for col in zip(*grid)]`."
