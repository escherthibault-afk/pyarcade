id: w7-l03
world: 7
type: code_fill
title: "Créer une grille"
concepts: [grilles, comprehension, alias]
difficulty: 2
estimated_minutes: 3
xp: 30
story: "Le plateau vide du jeu : `height` lignes de `width` cases."
statement_md: "Renvoie une grille de `height` lignes et `width` colonnes remplie de `value`, **sans aliasing** (chaque ligne est une liste distincte)."
starter_code: |
  def create_grid(width, height, value):
      """Return a height x width grid filled with value (independent rows)."""
      pass
solution: |
  def create_grid(width, height, value):
      """Return a height x width grid filled with value (independent rows)."""
      return [[value] * width for _ in range(height)]
tests:
  visible:
    - call: create_grid(3, 2, 0)
      expected: "[[0, 0, 0], [0, 0, 0]]"
  hidden:
    - setup: "g = create_grid(3, 3, 0)\ng[0][0] = 1"
      call: "g"
      expected: "[[1, 0, 0], [0, 0, 0], [0, 0, 0]]"
      label: "les lignes sont indépendantes"
    - call: create_grid(0, 0, 1)
      expected: "[]"
    - call: create_grid(1, 3, ".")
      expected: "[['.'], ['.'], ['.']]"
      label: "largeur ≠ hauteur"
hints:
  - "Une nouvelle ligne pour chaque y."
  - "Compréhension : `[... for _ in range(height)]`."
  - "`[[value] * width for _ in range(height)]`"
