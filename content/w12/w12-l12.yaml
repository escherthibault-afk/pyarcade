id: w12-l12
world: 12
type: copy
title: "Mode copie : peut-on bouger ?"
concepts: [grilles, jeu2048, conditions]
difficulty: 3
estimated_minutes: 5
xp: 50
story: "DS papier : la fonction qui décide si la partie de 2048 est finie."
statement_md: "Renvoie `True` s'il existe une case vide (0) **ou** deux cases voisines (horizontalement ou verticalement) de même valeur."
starter_code: |
  def can_move(grid):
      """Return True if a move is still possible."""
      pass
solution: |
  def can_move(grid):
      """Return True if a move is still possible."""
      size = len(grid)
      for y in range(size):
          for x in range(size):
              if grid[y][x] == 0:
                  return True
              if x + 1 < size and grid[y][x] == grid[y][x + 1]:
                  return True
              if y + 1 < size and grid[y][x] == grid[y + 1][x]:
                  return True
      return False
tests:
  visible:
    - call: can_move([[2, 4], [4, 2]])
      expected: "False"
  hidden:
    - call: can_move([[2, 0], [4, 2]])
      expected: "True"
    - call: can_move([[2, 2], [4, 8]])
      expected: "True"
      label: "fusion horizontale"
    - call: can_move([[2, 4], [2, 8]])
      expected: "True"
      label: "fusion verticale"
hints: []
